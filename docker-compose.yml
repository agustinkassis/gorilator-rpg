# Gorilator — single-service game stack. The same container serves the client,
# WebSocket/API, and Colyseus monitor on one port.
#
#   gorilator start      → docker compose up -d
#   docker compose up -d  also works standalone (reads ./.env)
name: gorilator

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: gorilator-game
    ports:
      - "${GAME_SERVER_PORT:-2567}:${GAME_SERVER_PORT:-2567}"
    environment:
      GAME_SERVER_PORT: "${GAME_SERVER_PORT:-2567}"
      # When set, the Colyseus /colyseus monitor requires HTTP Basic auth.
      MONITOR_USER: "${MONITOR_USER:-}"
      MONITOR_PASS: "${MONITOR_PASS:-}"
      # The server's Nostr key — signs players' progress saves to the relays.
      # Empty → an ephemeral key is generated at boot (saves won't survive a
      # restart; the generated nsec is printed to the server logs).
      NOSTR_NSEC: "${NOSTR_NSEC:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.GAME_SERVER_PORT||2567)+'/healthz').then(r=>r.text()).then(t=>process.exit(t.trim()==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
