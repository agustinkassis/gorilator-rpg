# Gorilator client — static SPA served by nginx.
# Dropped in at /etc/nginx/conf.d/default.conf (inside the stock http{} block,
# which already `include`s mime.types), so the types{} below augments defaults.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Babylon's loaders rely on these Content-Types; stock nginx ships none of
    # them. (.glb is already-packed binary, so it is excluded from gzip below.)
    types {
        model/gltf-binary  glb;
        model/gltf+json    gltf;
        application/wasm   wasm;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm
        model/gltf+json;

    # Health check (used by `gorilator status` and the client container probe).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets are immutable — cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Models / props can be updated, so cache but allow revalidation.
    location /models/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback (single-page canvas app).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
