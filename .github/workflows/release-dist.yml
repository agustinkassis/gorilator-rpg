name: Release prebuilt dist

# Builds the game once and attaches a prebuilt dist tarball to the GitHub Release,
# so `gorilator install`/`update` can skip the (slow) client build. The bundle is
# same-origin (the default one-host deploy); other build modes still build from source.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the dist for"
        required: true

permissions:
  contents: write # upload release assets

jobs:
  dist:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build (shared + client same-origin + cli, parallel via Turbo)
        run: pnpm exec turbo run build --filter @rpg/shared --filter @rpg/client --filter gorilator
        env:
          VITE_SAME_ORIGIN: "1"

      - name: Package prebuilt dist
        run: |
          ASSET="gorilator-dist-${TAG}.tar.gz"
          tar -czf "$ASSET" \
            packages/shared/dist \
            packages/client/dist \
            packages/cli/dist
          sha256sum "$ASSET" > SHA256SUMS
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -lh "$ASSET"; cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" SHA256SUMS --clobber
